name: Run Tests in MATLAB Project
on: [push]
jobs:
    my-job:
        name: Run MATLAB Tests
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
            - name: Set up MATLAB
              uses: matlab-actions/setup-matlab@v3
            - name: Run tests
              uses: matlab-actions/run-tests@v3
